[package]
name = "carcossonne-uct"
version = "0.1.0"
edition = "2024"

[dependencies]
heapless = "0.9.3"
itertools = "0.14.0"
postcard = "1.1.3"
rand = "0.10.1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0.18"
tileset_format = { path = "tileset_format" }

[build-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
toml = "1.1.2"
tileset_format = { path = "tileset_format" }
