[package]
name = "carcossonne_uct"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
heapless = "0.9.3"
itertools = "0.14.0"
postcard = "1.1.3"
rand = "0.10.1"
getrandom = { version = "0.4.2", features = ["wasm_js"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0.18"
tileset_format = { path = "tileset_format" }
tinyvec = { version = "1.11.0", features = ["alloc"] }
wasm-bindgen = "0.2.122"
js-sys = "0.3.99"
rapidhash = "4.4.1"

[build-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
toml = "1.1.2"
tileset_format = { path = "tileset_format" }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "game_logic_bench"
harness = false
